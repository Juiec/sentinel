<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel API Client</title>
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #161822;
            --bg-tertiary: #1c1e2a;
            --bg-hover: #252836;
            --text-primary: #e4e7ed;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-light: rgba(99, 102, 241, 0.15);
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --border: #2a2d3a;
            --scrollbar-thumb: #3a3d4a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

    </style>
</head>
<body>

<!-- API Config Modal -->
<div id="api-config">
    <div class="config-card">
        <h2 style="margin-bottom:16px;">Connect to Sentinel API</h2>
        <p style="color:var(--text-secondary);margin-bottom:20px;">Enter the base URL of your Sentinel backend.</p>
        <div class="form-group">
            <label>API Base URL</label>
            <input type="text" id="api-url" value="http://127.0.0.1:3001" placeholder="http://127.0.0.1:3001">
        </div>
        <button class="btn btn-primary" onclick="saveApiConfig()">Connect</button>
    </div>
</div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="Enter password">
        </div>
        <button class="btn btn-primary" onclick="handleLogin()">Sign In</button>
        <div class="login-error" id="login-error"></div>
    </div>
</div>

<!-- Main App -->
<div id="app">
    <div class="app-layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Chats</h2>
                <button class="new-chat-btn" onclick="createNewThread()">+ New Chat</button>
            </div>
            <div class="model-selector">
                <select id="model-select" onchange="onModelChange()"></select>
                <div style="display:flex;gap:4px;margin-top:8px;">
                    <button class="load-model-btn btn-sm" onclick="loadModel()">Load Model</button>
                    <button class="unload-model-btn btn-sm" onclick="unloadModel()">Unload</button>
                </div>
                <div class="model-status" id="model-status">No model loaded</div>
            </div>
            <div class="sidebar-section" id="thread-list">
                <h3>Threads</h3>
                <div id="threads"></div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="top-bar">
                <h2 id="thread-title">New Chat</h2>
                <div class="top-bar-actions">
                    <button class="btn btn-secondary btn-sm" onclick="showApiExplorer()">API Explorer</button>
                    <button class="btn btn-secondary btn-sm" onclick="showSettings()">Settings</button>
                    <button class="btn btn-secondary btn-sm" onclick="handleLogout()">Logout</button>
                </div>
            </div>

            <!-- Chat Messages -->
            <div class="chat-messages" id="chat-messages">
                <div class="welcome-screen" id="welcome-screen">
                    <h1>Sentinel API Client</h1>
                    <p>A pure API-based chat interface for the Sentinel backend.</p>
                    <button class="btn btn-primary" onclick="createNewThread()">Start a New Chat</button>
                </div>
            </div>

            <!-- Chat Input -->
            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <textarea class="chat-input" id="chat-input" placeholder="Type your message..." rows="1"></textarea>
                    <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
                </div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <span><span class="status-dot connected" id="status-dot"></span> Connected to API</span>
                <span id="status-info"></span>
            </div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settings-panel">
        <h3>Settings</h3>
        <div class="setting-group">
            <label>Temperature</label>
            <input type="number" id="setting-temp" value="0.7" min="0" max="2" step="0.1">
        </div>
        <div class="setting-group">
            <label>Max Tokens</label>
            <input type="number" id="setting-max-tokens" value="2048" min="1" max="32768">
        </div>
        <div class="setting-group">
            <label>Top-p</label>
            <input type="number" id="setting-top-p" value="0.9" min="0" max="1" step="0.01">
        </div>
        <div class="setting-group">
            <label>Stop Sequences (comma-separated)</label>
            <input type="text" id="setting-stop" placeholder="e.g. \n, User:">
        </div>
        <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
    </div>

    <!-- API Explorer Modal -->
    <div class="modal-overlay" id="api-explorer-modal">
        <div class="modal">
            <h3>API Explorer</h3>
            <div class="tabs">
                <div class="tab active" onclick="showApiTab('chat')">Chat</div>
                <div class="tab" onclick="showApiTab('models')">Models</div>
                <div class="tab" onclick="showApiTab('hub')">Hub</div>
            </div>
            <div id="api-explorer-content" class="api-explorer"></div>
            <button class="btn btn-secondary" style="margin-top:16px;" onclick="closeApiExplorer()">Close</button>
        </div>
    </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script>
// ============================================================
// API Client - Pure API-based frontend for Sentinel backend
// ============================================================

const API = {
    _base: 'http://127.0.0.1:3001',
    _token: null,
    _refreshToken: null,

    setBase(url) { this._base = url; },
    get base() { return this._base; },
    
    setToken(token) { 
        this._token = token; 
        localStorage.setItem('sentinel_auth_token', token);
    },
    getToken() {
        if (!this._token) {
            this._token = localStorage.getItem('sentinel_auth_token');
        }
        return this._token;
    },

    async _request(method, path, body = null, headers = {}) {
        const url = path.startsWith('http') ? path : `${this._base}${path}`;
        const reqHeaders = {
            'Content-Type': 'application/json',
            ...headers
        };
        
        const token = this.getToken();
        if (token && !path.includes('/login') && !path.includes('/refresh')) {
            reqHeaders['Authorization'] = `Bearer ${token}`;
        }

        const options = { method, headers: reqHeaders };
        if (body !== null) options.body = JSON.stringify(body);

        try {
            const response = await fetch(url, options);
            
            if (response.status === 401) {
                // Try refresh token
                if (this._refreshToken && !path.includes('/refresh')) {
                    await this._refreshSession();
                    return this._request(method, path, body, headers);
                }
                throw new Error('Authentication expired. Please login again.');
            }
            
            const data = await response.json().catch(() => null);
            if (!response.ok) {
                throw new Error(data?.detail || data?.message || `Request failed (${response.status})`);
            }
            return data;
        } catch (err) {
            if (err.message.includes('Authentication expired')) throw err;
            throw new Error(`API Error: ${err.message} (${method} ${path})`);
        }
    },
